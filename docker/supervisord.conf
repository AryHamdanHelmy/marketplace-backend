; Satu container, empat proses. Sebelumnya hanya ada satu: `php artisan
; serve`. Akibatnya bukan cuma soal kinerja — scheduler tidak pernah jalan,
; jadi payments:expire, orders:auto-complete, dan shipping:poll tidak pernah
; dieksekusi sama sekali di produksi.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Loop scheduler Laravel: bangun tiap menit, jalankan yang jatuh tempo.
[program:scheduler]
command=php /app/artisan schedule:work
user=www-data
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; QUEUE_CONNECTION sudah lama diset ke database, tapi tidak ada satu pun
; proses yang mengambil jobnya. Worker ini yang membuat antrean itu berarti
; begitu ada job pertama yang di-dispatch.
[program:queue]
command=php /app/artisan queue:work --tries=3 --max-time=3600 --sleep=3
user=www-data
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
