# Satu server block, satu aplikasi. Railway menyuntikkan PORT saat runtime,
# jadi angkanya diisi entrypoint lewat envsubst — bukan ditulis mati di sini.
server {
    listen ${PORT};
    server_name _;

    root /app/public;
    index index.php;

    # Upload produk dan file import Excel. Validasi Laravel membatasi 2–3 MB;
    # batas di sini sedikit lebih longgar supaya yang menolak adalah pesan
    # validasi yang bisa dibaca, bukan 413 dari nginx.
    client_max_body_size 12m;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;

        # Checkout memanggil penyedia ongkir dengan timeout 15 detik dan dua
        # kali retry. Batas di bawah ini harus di atas itu, atau nginx memutus
        # request yang sebenarnya masih sehat.
        fastcgi_read_timeout 60s;
    }

    # Jangan pernah menyajikan berkas tersembunyi — .env termasuk.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
